name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch when new commits arrive,
# so a fast-pushed series of commits doesn't queue up duplicate work.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint + Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up JDK 17 (PySpark local mode needs Java on PATH)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Format check with black
        run: black --check .

      - name: Run pytest (unit tests only, no integration)
        env:
          PYSPARK_PYTHON: python
          PYSPARK_DRIVER_PYTHON: python
        # `shell: bash` for pipefail — the default shell returns tee's status, so
        # without it a failing suite would pipe into tee and report success.
        shell: bash
        # This is the README's "Verify in 60 seconds" path, run exactly as a
        # reviewer would run it from a cold clone.
        run: pytest tests/ -m "not integration" -q | tee pytest-summary.txt

      - name: Hold the published counts to the suite
        # The README and the case study both say "139 passed, 1 skipped". Nothing
        # defended that number, so it could drift silently and leave a published
        # claim wrong. Adding or removing a test should fail here until both are
        # updated with it — that is the point, not an inconvenience.
        run: |
          expected="139 passed, 1 skipped"
          if ! grep -qE "^${expected}" pytest-summary.txt; then
            echo "::error::Published count drifted. README and the case study say '${expected}'."
            echo "Actual summary:"; tail -3 pytest-summary.txt
            exit 1
          fi
          echo "Suite matches the published ${expected}."

  docker-build:
    name: Verify Airflow image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Airflow image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.airflow
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
